<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Tiendas - MULTISHOP</title>
    <link rel="icon" type="image/png" href="../Assets/img/LOGO.png">
    <link rel="preload" href="../Assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../Assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/tokens.css">
    <link rel="stylesheet" href="../Assets/css/base.css">
    <link rel="stylesheet" href="../Assets/css/components.css">
    <link rel="stylesheet" href="../Assets/css/layout.css">
    <link rel="stylesheet" href="../Assets/css/pages.css">
    <link rel="stylesheet" href="../Assets/css/pages-catalogo.css">
    <link rel="stylesheet" href="../Assets/css/pages-cuenta.css">
    <link rel="stylesheet" href="../Assets/css/pages-paneles.css">
    <link rel="stylesheet" href="../Assets/css/multishop.css">
    <script>
        // Tema guardado antes de dibujar (sin parpadeo).
        try { var t = localStorage.getItem('ms-tema'); if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); document.documentElement.setAttribute('data-bs-theme', 'dark'); } } catch (e) { }
    </script>
</head>
<body>
<header id="barraNav"></header>

<main id="contenido" class="ms-main" tabindex="-1">
    <div class="container">
        <div class="ms-page-head">
            <div><h1 id="tituloTiendas">Tiendas</h1><p id="conteoTiendas"></p></div>
            <form class="ms-filtro-tiendas" id="formTiendas" role="search">
                <label class="visually-hidden" for="buscarTienda">Buscar tienda por nombre</label>
                <input type="search" id="buscarTienda" name="q" class="form-control" placeholder="Buscar tienda por nombre" maxlength="60">
                <button type="submit" class="btn btn-ms-primary" aria-label="Buscar"><i class="bi bi-search"></i></button>
            </form>
        </div>
        <div class="ms-chips envuelve mb-4" id="chipsCategorias"></div>
        <div id="listaTiendas"></div>
    </div>
</main>

<footer id="piePagina"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../Controlador/comun.js"></script>
<script src="../Controlador/categorias.js"></script>
</body>
</html>
