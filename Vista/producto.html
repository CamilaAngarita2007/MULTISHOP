<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Producto - MULTISHOP</title>
    <link rel="icon" type="image/png" href="../Assets/img/LOGO.png">
    <link rel="preload" href="../Assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../Assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/tokens.css">
    <link rel="stylesheet" href="../Assets/css/base.css">
    <link rel="stylesheet" href="../Assets/css/components.css">
    <link rel="stylesheet" href="../Assets/css/layout.css">
    <link rel="stylesheet" href="../Assets/css/pages.css">
    <link rel="stylesheet" href="../Assets/css/pages-catalogo.css">
    <link rel="stylesheet" href="../Assets/css/pages-cuenta.css">
    <link rel="stylesheet" href="../Assets/css/pages-paneles.css">
    <link rel="stylesheet" href="../Assets/css/multishop.css">
    <script>
        // Tema guardado antes de dibujar (sin parpadeo).
        try { var t = localStorage.getItem('ms-tema'); if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); document.documentElement.setAttribute('data-bs-theme', 'dark'); } } catch (e) { }
    </script>
</head>
<body>
<header id="barraNav"></header>

<main id="contenido" class="ms-main" tabindex="-1">
    <div class="container">
        <nav aria-label="Ruta de navegación" class="mt-4"><ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="categorias.html">Tiendas</a></li>
            <li class="breadcrumb-item"><a href="#" id="migaTienda">Tienda</a></li>
            <li class="breadcrumb-item active" aria-current="page" id="migaProducto">Producto</li>
        </ol></nav>
        <div class="pd">
            <div class="pd-galeria">
                <img id="galeriaPrincipal" class="pd-principal" src="../Assets/img/LOGO.png" alt="">
                <div class="pd-minis" id="galeriaMiniaturas" role="group" aria-label="Más fotos del producto" hidden></div>
            </div>
            <div class="pd-info">
                <a href="#" class="pd-tienda" id="enlaceTienda"></a>
                <h1 id="nombreProducto">&nbsp;</h1>
                <div class="pd-valoracion" id="valoracion"></div>
                <div class="pd-precio" id="precio"></div>
                <p class="pd-nota" id="notaOferta" hidden></p>
                <p class="pd-desc" id="descripcion"></p>
                <p class="pd-stock" id="stock"></p>
                <div id="zonaCompra"></div>
                <div class="pd-secundarios" id="secundarios"></div>
            </div>
        </div>

        <section id="resenas" class="ms-seccion" aria-labelledby="tituloOpiniones">
            <div class="ms-seccion-cab"><h2 id="tituloOpiniones">Opiniones de clientes</h2></div>
            <div class="pd-opiniones">
                <div class="pd-resumen" id="resumenResenas"></div>
                <div><div id="zonaResena"></div><div id="listaResenas"></div><div id="paginadorResenas"></div></div>
            </div>
        </section>

        <section class="ms-seccion" id="seccionRelacionados" aria-labelledby="tituloRelacionados" hidden>
            <div class="ms-seccion-cab"><h2 id="tituloRelacionados">Más de esta tienda</h2><a href="#" id="verTienda">Ver toda la tienda <i class="bi bi-arrow-right"></i></a></div>
            <div class="ms-grid compacta" id="relacionados"></div>
        </section>
    </div>
</main>

<footer id="piePagina"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../Controlador/comun.js"></script>
<script src="../Controlador/filtros.js"></script>
<script src="../Controlador/producto.js"></script>
</body>
</html>
