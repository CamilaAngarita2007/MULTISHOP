<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Tienda - MULTISHOP</title>
    <link rel="icon" type="image/png" href="../Assets/img/LOGO.png">
    <link rel="preload" href="../Assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../Assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/tokens.css">
    <link rel="stylesheet" href="../Assets/css/base.css">
    <link rel="stylesheet" href="../Assets/css/components.css">
    <link rel="stylesheet" href="../Assets/css/layout.css">
    <link rel="stylesheet" href="../Assets/css/pages.css">
    <link rel="stylesheet" href="../Assets/css/pages-catalogo.css">
    <link rel="stylesheet" href="../Assets/css/pages-cuenta.css">
    <link rel="stylesheet" href="../Assets/css/pages-paneles.css">
    <link rel="stylesheet" href="../Assets/css/multishop.css">
    <script>
        // Tema guardado antes de dibujar (sin parpadeo).
        try { var t = localStorage.getItem('ms-tema'); if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); document.documentElement.setAttribute('data-bs-theme', 'dark'); } } catch (e) { }
    </script>
</head>
<body>
<header id="barraNav"></header>

<main id="contenido" class="ms-main" tabindex="-1">
    <section class="tb sin-imagen" id="bannerTienda">
        <i class="tb-deco bi bi-shop" id="decoTienda" aria-hidden="true"></i>
        <div class="container tb-in">
            <img class="tb-logo" id="logoTienda" src="../Assets/img/LOGO.png" alt="">
            <div class="tb-texto">
                <h1 id="nombreTienda">&nbsp;</h1>
                <span class="tb-cat" id="categoriaTienda"></span>
                <ul class="tb-meta" id="metaTienda"></ul>
            </div>
            <div class="tb-acciones" id="accionesTienda"></div>
        </div>
    </section>

    <div class="container">
        <div class="tb-info" id="infoTienda" hidden></div>
        <section class="ms-seccion" aria-labelledby="tituloProductos">
            <div class="ms-seccion-cab"><h2 id="tituloProductos">Productos</h2><span class="text-muted" id="conteo"></span></div>
        <form class="fp" id="formFiltros" role="search" aria-label="Buscar y filtrar productos">
            <div class="fp-fila">
                <div class="fp-campo crece">
                    <label for="fq">Buscar</label>
                    <div class="fp-buscar"><i class="bi bi-search" aria-hidden="true"></i>
                        <input type="search" name="q" id="fq" class="form-control" placeholder="Nombre o descripción" maxlength="60"></div>
                </div>
                
                <div class="fp-campo precio"><label for="fmin">Precio desde</label>
                    <input type="number" name="min" id="fmin" class="form-control" min="0" step="1000" inputmode="numeric" placeholder="$ 0"></div>
                <div class="fp-campo precio"><label for="fmax">Precio hasta</label>
                    <input type="number" name="max" id="fmax" class="form-control" min="0" step="1000" inputmode="numeric" placeholder="Sin tope"></div>
                <button type="submit" class="btn btn-ms-primary"><i class="bi bi-funnel"></i>Aplicar</button>
            </div>
            <div class="fp-fila">
                <div class="fp-opciones">
                    <label class="ms-opcion"><input type="checkbox" name="oferta" value="1"><span><i class="bi bi-tag"></i>Solo ofertas</span></label>
                    <label class="ms-opcion"><input type="checkbox" name="disponibles" value="1"><span><i class="bi bi-check2-circle"></i>Solo disponibles</span></label>
                </div>
                <div class="fp-fin">
                    <button type="button" class="btn btn-link fp-quitar" hidden><i class="bi bi-x-circle"></i>Quitar filtros</button>
                    <div class="fp-campo"><label for="forden">Ordenar por</label>
                        <select name="orden" id="forden" class="form-select">
                            <option value="novedad">Más recientes</option>
                            <option value="precio_asc">Precio: menor a mayor</option>
                            <option value="precio_desc">Precio: mayor a menor</option>
                            <option value="calificacion">Mejor calificados</option>
                            <option value="nombre">Nombre (A-Z)</option>
                        </select></div>
                </div>
            </div>
        </form>
            <div id="productos"></div>
            <div id="paginador"></div>
        </section>
    </div>

    <div class="modal fade" id="modalCalificar" tabindex="-1" aria-labelledby="tituloCalificar" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="formCalificar">
                <div class="modal-header"><h2 class="modal-title" id="tituloCalificar">Califica esta tienda</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
                <div class="modal-body">
                    <fieldset class="ms-puntaje"><legend class="visually-hidden">Puntuación</legend>
                        <input type="radio" id="estrellaTienda5" name="puntuacion" value="5" required><label for="estrellaTienda5" title="5 de 5"><i class="bi bi-star-fill"></i><span class="visually-hidden">5 de 5</span></label>
                        <input type="radio" id="estrellaTienda4" name="puntuacion" value="4"><label for="estrellaTienda4" title="4 de 5"><i class="bi bi-star-fill"></i><span class="visually-hidden">4 de 5</span></label>
                        <input type="radio" id="estrellaTienda3" name="puntuacion" value="3"><label for="estrellaTienda3" title="3 de 5"><i class="bi bi-star-fill"></i><span class="visually-hidden">3 de 5</span></label>
                        <input type="radio" id="estrellaTienda2" name="puntuacion" value="2"><label for="estrellaTienda2" title="2 de 5"><i class="bi bi-star-fill"></i><span class="visually-hidden">2 de 5</span></label>
                        <input type="radio" id="estrellaTienda1" name="puntuacion" value="1"><label for="estrellaTienda1" title="1 de 5"><i class="bi bi-star-fill"></i><span class="visually-hidden">1 de 5</span></label>
                    </fieldset>
                    <label class="form-label mt-3" for="comentarioTienda">Comentario (opcional)</label>
                    <textarea class="form-control" id="comentarioTienda" name="comentario" rows="3" maxlength="500" placeholder="¿Cómo te atendieron? ¿Llegó a tiempo?"></textarea>
                    <p id="mensajeCalificar" class="ms-mensaje" role="status" aria-live="polite"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-danger me-auto" id="eliminarCalificacion" hidden>Eliminar</button>
                    <button type="submit" class="btn btn-ms-primary">Guardar calificación</button>
                </div>
            </form>
        </div>
    </div>
</main>

<footer id="piePagina"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../Controlador/comun.js"></script>
<script src="../Controlador/filtros.js"></script>
<script src="../Controlador/tienda.js"></script>
</body>
</html>
