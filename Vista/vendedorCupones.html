<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Cupones - MULTISHOP</title>
    <link rel="icon" type="image/png" href="../Assets/img/LOGO.png">
    <link rel="preload" href="../Assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../Assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/css/tokens.css">
    <link rel="stylesheet" href="../Assets/css/base.css">
    <link rel="stylesheet" href="../Assets/css/components.css">
    <link rel="stylesheet" href="../Assets/css/layout.css">
    <link rel="stylesheet" href="../Assets/css/pages.css">
    <link rel="stylesheet" href="../Assets/css/pages-catalogo.css">
    <link rel="stylesheet" href="../Assets/css/pages-cuenta.css">
    <link rel="stylesheet" href="../Assets/css/pages-paneles.css">
    <link rel="stylesheet" href="../Assets/css/multishop.css">
    <script>
        // Tema guardado antes de dibujar (sin parpadeo).
        try { var t = localStorage.getItem('ms-tema'); if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); document.documentElement.setAttribute('data-bs-theme', 'dark'); } } catch (e) { }
    </script>
</head>
<body data-pagina="cupones">
<header id="barraNav"></header>

<main id="contenido" class="ms-main" tabindex="-1">
    <div class="container">
        <div class="ms-panel">
            <aside id="panelLateral"></aside>
            <section class="ms-panel-main">
        <div class="ms-page-head">
            <div><h1>Cupones</h1><p>Crea cupones para tu tienda y envíaselos por el chat a tus clientes.</p></div>
            
        </div>
                <form id="formCupon" class="ms-card pn-bloque">
                    <div class="pn-bloque-cab"><h2>Nuevo cupón</h2><p>Cada cliente lo puede usar una vez y solo descuenta productos de tu tienda.</p></div>
                    <div class="pn-campos">
                        <div><label class="form-label" for="codigo">Código</label><input class="form-control text-uppercase" id="codigo" name="codigo" maxlength="50" required placeholder="BIENVENIDO10"></div>
                        <div><label class="form-label" for="tipo">Tipo</label><select class="form-select" id="tipo" name="tipo"><option value="Porcentaje">Porcentaje</option><option value="Monto">Monto fijo</option></select></div>
                        <div><label class="form-label" for="valor">Valor (<span id="unidadValor">%</span>)</label><input type="number" class="form-control" id="valor" name="valor" min="1" max="100" step="any" required></div>
                        <div><label class="form-label" for="compraMinima">Compra mínima</label><input type="number" class="form-control" id="compraMinima" name="compraMinima" min="0" step="1000" placeholder="Opcional"></div>
                        <div><label class="form-label" for="usosMaximos">Usos máximos</label><input type="number" class="form-control" id="usosMaximos" name="usosMaximos" min="1" placeholder="Sin límite"></div>
                        <div><label class="form-label" for="inicio">Desde</label><input type="date" class="form-control" id="inicio" name="inicio" required></div>
                        <div><label class="form-label" for="fin">Hasta</label><input type="date" class="form-control" id="fin" name="fin" required></div>
                        <div class="ancho pn-acciones"><button class="btn btn-ms-primary" type="submit"><i class="bi bi-plus-lg"></i>Crear cupón</button></div>
                        <p id="mensajeCupon" class="ms-mensaje ancho" role="status" aria-live="polite"></p>
                    </div>
                </form>
                <section class="pn-seccion"><h2 class="pn-subtitulo">Mis cupones</h2><div id="listaCupones"></div></section>
            </section>
        </div>
    </div>
</main>

<footer id="piePagina"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../Controlador/comun.js"></script>
<script src="../Controlador/vendedorCupones.js"></script>
</body>
</html>
